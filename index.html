<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Project Superhero</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#ffd84d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Project Superhero">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E✝%3C/text%3E%3C/svg%3E">

<style>
:root{
    --bg:#162a49;
    --panel:#21395f;
    --panel2:#29466f;
    --text:#fffdf2;
    --muted:#d4def0;
    --line:#5273a3;
    --accent:#ffd84d;
    --faith:#ffe36e;
    --hope:#8fc7ff;
    --love:#ff91b1;
    --good:#79e6aa;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:
        radial-gradient(circle at top, #284a7a 0%, var(--bg) 45%);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
    overscroll-behavior-y:contain;
}

button,
input,
textarea{
    font:inherit;
    touch-action:manipulation;
}

button{
    min-height:44px;
    cursor:pointer;
}

.app{
    width:100%;
    max-width:720px;
    margin:auto;
    padding:18px 14px calc(105px + env(safe-area-inset-bottom));
}

header{
    text-align:center;
    padding:8px 0 18px;
}

.brand{
    font-size:clamp(24px,7vw,34px);
    font-weight:900;
    letter-spacing:1px;
    color:var(--accent);
    text-shadow:0 2px 10px rgba(255,216,77,.18);
}

.subtitle{
    margin-top:5px;
    color:var(--muted);
    font-size:13px;
    letter-spacing:2px;
}

.hud{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:14px;
}

.stat{
    background:rgba(33,57,95,.9);
    border:1px solid var(--line);
    border-radius:14px;
    padding:11px 7px;
    text-align:center;
    box-shadow:0 5px 16px rgba(0,0,0,.14);
}

.stat b{
    display:block;
    font-size:19px;
    margin-bottom:3px;
}

.stat span{
    font-size:11px;
    color:var(--muted);
}

.card{
    background:rgba(33,57,95,.96);
    border:1px solid var(--line);
    border-radius:18px;
    padding:16px;
    margin-bottom:13px;
    box-shadow:0 8px 24px rgba(0,0,0,.16);
}

.card h2{
    margin:0 0 11px;
    font-size:19px;
}

.card h3{
    margin:0 0 8px;
}

.muted{
    color:var(--muted);
}

.row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.grid{
    display:grid;
    gap:10px;
}

.fhl{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
    margin-top:10px;
}

.fhl .stat{
    padding:14px 6px;
    background:linear-gradient(180deg,var(--panel2),var(--panel));
}

.fhl .faith{
    color:var(--faith);
}

.fhl .hope{
    color:var(--hope);
}

.fhl .love{
    color:var(--love);
}

button{
    border:1px solid var(--line);
    border-radius:12px;
    padding:11px 14px;
    background:var(--panel2);
    color:var(--text);
    font-weight:700;
    transition:
        transform .12s ease,
        filter .12s ease,
        background .15s ease,
        border-color .15s ease;
}

button:active{
    transform:scale(.96);
    filter:brightness(1.15);
}

button:focus-visible{
    outline:3px solid var(--accent);
    outline-offset:2px;
}

.primary{
    background:var(--accent);
    color:#182b49;
    border-color:var(--accent);
}

.good{
    background:var(--good);
    color:#102b20;
    border-color:var(--good);
}

.danger{
    background:#6d3142;
}

.actions{
    display:flex;
    flex-wrap:wrap;
    gap:9px;
    margin-top:11px;
}

.actions button{
    flex:1 1 130px;
}

input,
textarea{
    width:100%;
    border:1px solid var(--line);
    border-radius:11px;
    background:#172d4e;
    color:var(--text);
    padding:11px 12px;
    font-size:16px;
}

textarea{
    min-height:125px;
    resize:vertical;
}

input:focus,
textarea:focus{
    outline:2px solid var(--accent);
    outline-offset:1px;
}

.view{
    display:none;
}

.view.active{
    display:block;
}

.nav{
    position:fixed;
    z-index:50;
    left:0;
    right:0;
    bottom:0;
    display:flex;
    justify-content:center;
    gap:6px;
    padding:8px 8px calc(8px + env(safe-area-inset-bottom));
    background:rgba(15,30,52,.96);
    border-top:1px solid var(--line);
    backdrop-filter:blur(12px);
}

.nav button{
    flex:1;
    max-width:130px;
    min-height:56px;
    padding:7px 5px;
    border-radius:13px;
    background:transparent;
    border-color:transparent;
    color:var(--muted);
    font-size:12px;
}

.nav button.active{
    background:var(--panel2);
    color:var(--accent);
    border-color:var(--line);
}

.modal{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    padding:18px;
    background:rgba(5,13,25,.78);
}

.modal.active{
    display:flex;
}

.modal .card{
    width:100%;
    max-width:600px;
    max-height:90vh;
    overflow:auto;
}

.world{
    min-height:62vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:999px;
    background:var(--panel2);
    border:1px solid var(--line);
    color:var(--muted);
    font-size:11px;
}

hr{
    border:0;
    border-top:1px solid var(--line);
    margin:14px 0;
}

/* PHONE COMFORT */
@media(max-width:600px){
    .app{
        padding:12px 11px calc(100px + env(safe-area-inset-bottom));
    }

    header{
        padding-top:5px;
        padding-bottom:14px;
    }

    .hud{
        gap:7px;
    }

    .stat{
        border-radius:13px;
        padding:10px 5px;
    }

    .stat b{
        font-size:18px;
    }

    .card{
        padding:14px;
        border-radius:16px;
        margin-bottom:11px;
    }

    .actions{
        gap:8px;
    }

    .actions button{
        flex-basis:145px;
    }

    .world{
        min-height:52vh;
    }
}

/* SPLASH SCREEN */
.splash{
    position:fixed;
    inset:0;
    z-index:999;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    background:
        radial-gradient(circle at center, #294b7c 0%, #162a49 65%);
    animation:splashFadeOut .65s ease 1.05s forwards;
    pointer-events:none;
}

.splash-cross{
    font-size:64px;
    line-height:1;
    color:var(--accent);
    text-shadow:
        0 0 10px rgba(255,216,77,.35),
        0 0 30px rgba(255,216,77,.18);
    animation:splashGlow 1s ease-in-out infinite alternate;
}

.splash-title{
    margin-top:15px;
    font-size:clamp(25px,8vw,38px);
    font-weight:900;
    letter-spacing:2px;
    color:var(--text);
}

.splash-sub{
    margin-top:9px;
    font-size:12px;
    letter-spacing:3px;
    color:var(--muted);
}

@keyframes splashGlow{
    from{
        transform:scale(.98);
        filter:brightness(.95);
    }
    to{
        transform:scale(1.03);
        filter:brightness(1.15);
    }
}

@keyframes splashFadeOut{
    to{
        opacity:0;
        visibility:hidden;
    }
}

/* SMALL SUCCESS FEEDBACK */
.pop{
    animation:pop .28s ease;
}

@keyframes pop{
    0%{transform:scale(1)}
    45%{transform:scale(1.04)}
    100%{transform:scale(1)}
}

@media(prefers-reduced-motion:reduce){
    *,
    *::before,
    *::after{
        scroll-behavior:auto !important;
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.01ms !important;
    }
}
</style>
</head>

<body>

<!-- PROJECT SUPERHERO SPLASH -->
<div class="splash" id="splash">
    <div class="splash-cross">✝</div>
    <div class="splash-title">PROJECT SUPERHERO</div>
    <div class="splash-sub">FAITH • HOPE • LOVE</div>
</div>

<div class="app">

<header>
    <div class="brand">✝ PROJECT SUPERHERO</div>
    <div class="subtitle">BECOME WHO YOU WERE MEANT TO BE</div>
</header>

<!-- HUD -->
<div class="hud">
    <div class="stat">
        <b id="level">1</b>
        <span>LEVEL</span>
    </div>

    <div class="stat">
        <b id="xp">0</b>
        <span>XP</span>
    </div>

    <div class="stat">
        <b id="fhl">0</b>
        <span>FHL</span>
    </div>

    <div class="stat">
        <b id="focus">—</b>
        <span>FOCUS</span>
    </div>

    <div class="stat">
        <b id="current">—</b>
        <span>CURRENT</span>
    </div>

    <div class="stat">
        <b id="settings">—</b>
        <span>SETTING</span>
    </div>
</div>

<!-- MISSIONS -->
<section id="missions" class="view active">

    <div class="card">
        <div class="row">
            <h2>Missions</h2>
            <span class="badge" id="missionCount">0 / 0</span>
        </div>

        <div id="missionList" class="grid"></div>
    </div>

</section>

<!-- NOTES -->
<section id="notes" class="view">

    <div class="card">
        <h2>Notes</h2>

        <textarea
            id="notesInput"
            placeholder="Write something worth remembering..."
        ></textarea>

        <div class="actions">
            <button class="primary" onclick="saveNotes()">Save Notes</button>
        </div>
    </div>

</section>

<!-- JOURNAL / LOG -->
<section id="log" class="view">

    <div class="card">
        <h2>Journal</h2>

        <textarea
            id="journalInput"
            placeholder="What happened today?"
        ></textarea>

        <div class="actions">
            <button class="primary" onclick="saveJournal()">Log Entry</button>
        </div>
    </div>

    <div class="card">
        <h2>History</h2>
        <div id="history"></div>
    </div>

</section>

<!-- WORLD -->
<section id="world" class="view">

    <div class="card world">
        <h2>World</h2>

        <p class="muted">
            The world changes when you do.
        </p>

        <div class="fhl">
            <div class="stat">
                <b class="faith">✝</b>
                <span>FAITH</span>
            </div>

            <div class="stat">
                <b class="hope">★</b>
                <span>HOPE</span>
            </div>

            <div class="stat">
                <b class="love">♥</b>
                <span>LOVE</span>
            </div>
        </div>
    </div>

</section>

<!-- ENCOUNTER MODAL -->
<div id="encounterModal" class="modal">

    <div class="card">

        <div class="row">
            <h2 id="encounterTitle">Encounter</h2>
            <button onclick="closeEncounter()">✕</button>
        </div>

        <p id="encounterText" class="muted"></p>

        <div id="encounterBody"></div>

        <div class="actions">
            <button class="primary" onclick="completeEncounter()">
                Complete
            </button>

            <button onclick="closeEncounter()">
                Cancel
            </button>
        </div>

    </div>

</div>

</div>

<!-- BOTTOM NAV -->
<nav class="nav">

    <button class="active" onclick="showView('missions',this)">
        HUD
    </button>

    <button onclick="showView('missions',this)">
        Missions
    </button>

    <button onclick="showView('notes',this)">
        Notes
    </button>

    <button onclick="showView('log',this)">
        Log
    </button>

    <button onclick="showView('world',this)">
        World
    </button>

</nav>

<script>
const KEY='ps_v01';

const defaultState={
    xp:0,
    level:1,
    fhl:0,
    focus:'Faith',
    current:'—',
    settings:'—',
    history:[],
    powers:[],
    chain:0,
    excellence:0,
    notes:'',
    activeEncounter:null,
    lastDate:''
};

let s=JSON.parse(localStorage.getItem(KEY)||'null')||defaultState;

const contexts=[
    'School',
    'Home',
    'Friends',
    'Self',
    'Future'
];

const settingOptions=[
    'School',
    'Home',
    'Social',
    'Alone',
    'Outside'
];

const missions=[
    {
        name:'Faith',
        text:'Take one intentional action rooted in faith.',
        xp:10
    },
    {
        name:'Hope',
        text:'Do something that moves your future forward.',
        xp:10
    },
    {
        name:'Love',
        text:'Do something kind for someone else.',
        xp:10
    }
];

const encounters=[
    {
        title:'The Crossroads',
        text:'You have a choice. Which direction will you take?',
        xp:15
    },
    {
        title:'The Challenge',
        text:'Something difficult is in front of you.',
        xp:20
    }
];

function save(){
    localStorage.setItem(KEY,JSON.stringify(s));
    render();
}

function resetIfNeeded(){

    const today=new Date().toDateString();

    if(s.lastDate!==today){
        s.lastDate=today;
        s.current='—';
        s.settings='—';
        s.activeEncounter=null;
        save();
    }
}

function escapeHtml(str){
    return String(str)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#039;');
}

function render(){

    document.getElementById('level').textContent=s.level;
    document.getElementById('xp').textContent=s.xp;
    document.getElementById('fhl').textContent=s.fhl;
    document.getElementById('focus').textContent=s.focus;
    document.getElementById('current').textContent=s.current;
    document.getElementById('settings').textContent=s.settings;

    document.getElementById('notesInput').value=s.notes||'';

    renderMissions();
    renderHistory();
}

function renderMissions(){

    const list=document.getElementById('missionList');

    list.innerHTML='';

    missions.forEach((m,i)=>{

        const done=s.history.some(
            h=>h.type==='mission' &&
            h.name===m.name &&
            h.date===new Date().toDateString()
        );

        const card=document.createElement('div');

        card.className='card';

        card.innerHTML=`
            <div class="row">
                <div>
                    <h3>${escapeHtml(m.name)}</h3>
                    <div class="muted">${escapeHtml(m.text)}</div>
                </div>

                <span class="badge">+${m.xp} XP</span>
            </div>

            <div class="actions">
                <button
                    class="${done?'good':'primary'}"
                    ${done?'disabled':''}
                    onclick="complete(${i})"
                >
                    ${done?'Completed':'Complete'}
                </button>
            </div>
        `;

        list.appendChild(card);
    });

    document.getElementById('missionCount').textContent=
        `${missions.filter(m=>
            s.history.some(
                h=>h.type==='mission' &&
                h.name===m.name &&
                h.date===new Date().toDateString()
            )
        ).length} / ${missions.length}`;
}

function complete(i){

    const m=missions[i];

    const alreadyDone=s.history.some(
        h=>h.type==='mission' &&
        h.name===m.name &&
        h.date===new Date().toDateString()
    );

    if(alreadyDone)return;

    s.xp+=m.xp;
    s.fhl+=1;

    if(s.xp>=s.level*100){
        s.xp-=s.level*100;
        s.level++;
    }

    s.history.unshift({
        type:'mission',
        name:m.name,
        xp:m.xp,
        date:new Date().toDateString()
    });

    save();

    setTimeout(()=>{
        const cards=document.querySelectorAll('#missionList .card');
        if(cards[i]){
            cards[i].classList.add('pop');
        }
    },20);

    alert(`${m.name} mission complete! +${m.xp} XP`);
}

function cycleFocus(){

    const index=contexts.indexOf(s.focus);

    s.focus=contexts[(index+1)%contexts.length];

    save();
}

function cycleCurrent(){

    const values=[
        '—',
        'Act',
        'Reflect',
        'Create',
        'Connect'
    ];

    const index=values.indexOf(s.current);

    s.current=values[(index+1)%values.length];

    save();
}

function cycleSetting(){

    const index=settingOptions.indexOf(s.settings);

    s.settings=settingOptions[
        (index+1)%settingOptions.length
    ];

    save();
}

function openEncounter(encounter){

    s.activeEncounter=encounter;

    document.getElementById('encounterTitle').textContent=
        encounter.title;

    document.getElementById('encounterText').textContent=
        encounter.text;

    document.getElementById('encounterBody').innerHTML=`
        <div class="card">
            <div class="muted">
                Choose your response and commit to it.
            </div>
        </div>
    `;

    document
        .getElementById('encounterModal')
        .classList.add('active');
}

function closeEncounter(){

    document
        .getElementById('encounterModal')
        .classList.remove('active');

    s.activeEncounter=null;

    save();
}

function completeEncounter(){

    if(!s.activeEncounter)return;

    const e=s.activeEncounter;

    s.xp+=e.xp;
    s.fhl+=1;

    s.history.unshift({
        type:'encounter',
        name:e.title,
        xp:e.xp,
        date:new Date().toDateString()
    });

    s.activeEncounter=null;

    if(s.xp>=s.level*100){
        s.xp-=s.level*100;
        s.level++;
    }

    document
        .getElementById('encounterModal')
        .classList.remove('active');

    save();

    alert(`${e.title} complete! +${e.xp} XP`);
}

function saveNotes(){

    s.notes=document
        .getElementById('notesInput')
        .value;

    save();

    alert('Notes saved.');
}

function saveJournal(){

    const input=document.getElementById('journalInput');

    const text=input.value.trim();

    if(!text)return;

    s.history.unshift({
        type:'journal',
        text:text,
        date:new Date().toDateString()
    });

    input.value='';

    save();

    alert('Journal entry logged.');
}

function renderHistory(){

    const box=document.getElementById('history');

    if(!s.history.length){
        box.innerHTML='<div class="muted">No history yet.</div>';
        return;
    }

    box.innerHTML=s.history.map(h=>{

        if(h.type==='journal'){
            return `
                <div class="card">
                    <div class="badge">${escapeHtml(h.date)}</div>
                    <p>${escapeHtml(h.text)}</p>
                </div>
            `;
        }

        return `
            <div class="card">
                <div class="row">
                    <div>
                        <b>${escapeHtml(h.name)}</b>
                        <div class="muted">${escapeHtml(h.date)}</div>
                    </div>

                    <span class="badge">
                        +${h.xp||0} XP
                    </span>
                </div>
            </div>
        `;

    }).join('');
}

function showView(id,button){

    document.querySelectorAll('.view')
        .forEach(v=>v.classList.remove('active'));

    document.getElementById(id)
        .classList.add('active');

    document.querySelectorAll('.nav button')
        .forEach(b=>b.classList.remove('active'));

    if(button){
        button.classList.add('active');
    }

    window.scrollTo({
        top:0,
        behavior:'smooth'
    });
}

resetIfNeeded();
render();

setInterval(()=>{
    resetIfNeeded();
},30000);

/* Keep the installed PWA working */
if('serviceWorker' in navigator){
    window.addEventListener('load',()=>{
        navigator.serviceWorker.register('/Project-Superhero/sw.js')
            .catch(err=>console.log('Service worker registration failed:',err));
    });
}
</script>

</body>
</html>
